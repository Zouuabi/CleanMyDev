name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: CleanCore tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Swift version
        run: swift --version
      - name: Test
        run: cd CleanCore && swift test --filter 'ProjectKindTests|GitProbeTests|ProjectClassifierTests|SafetyGuardTests|SettingsTests|QuarantineTests'

  app-build:
    name: App build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Build (unsigned)
        run: |
          xcodebuild -project CleanMyDev.xcodeproj -scheme CleanMyDev -configuration Release \
            -derivedDataPath build/dd build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM="" | xcbeautify || \
          xcodebuild -project CleanMyDev.xcodeproj -scheme CleanMyDev -configuration Release \
            -derivedDataPath build/dd build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=""
